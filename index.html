<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORT</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

* { box-sizing: border-box; }

html, body {
    margin: 0;
    height: 100%;
    background: #020302;
    color: #78a878;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#screen {
    width: 90%;
    max-width: 900px;
    height: 82%;
    padding: 28px;
    background: #061006;
    border: 1px solid #29402d;
    box-shadow: inset 0 0 70px #000, 0 0 25px #0b170d;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

#screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom,
        rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    opacity: .45;
    z-index: 10;
}

#log {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    font-size: clamp(14px, 2vw, 19px);
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    scrollbar-width: none;
}

#log::-webkit-scrollbar { display: none; }

.line { min-height: 1.65em; }
.dim { opacity: .45; }

.cursor {
    display: inline-block;
    width: .55em;
    height: 1em;
    vertical-align: -.15em;
    background: #78a878;
    animation: blink .7s steps(1) infinite;
}

@keyframes blink { 50% { opacity: 0; } }

/* ============ ФИНАЛЬНЫЙ РЕЖИМ ============ */

#log.finale-mode {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    white-space: normal;
}

.final-line {
    font-family: "VT323", "Courier New", monospace;
    font-size: clamp(22px, 5vw, 62px);
    font-weight: bold;
    letter-spacing: 3px;
    color: #b9e8b9;
    text-transform: uppercase;
    line-height: 1.25;
    white-space: normal;
    word-break: keep-all;
    /* жирная обводка — имитация DOS-шрифта */
    -webkit-text-stroke: 0.8px #b9e8b9;
    text-shadow:
        1.5px 0 0 #b9e8b9, -1.5px 0 0 #b9e8b9,
        0 1.5px 0 #b9e8b9, 0 -1.5px 0 #b9e8b9,
        1.5px 1.5px 0 #b9e8b9, -1.5px -1.5px 0 #b9e8b9,
        1.5px -1.5px 0 #b9e8b9, -1.5px 1.5px 0 #b9e8b9,
        0 0 18px rgba(120, 200, 120, 0.5),
        0 0 45px rgba(80, 160, 80, 0.35);
    position: relative;
    transition: color 0.2s, text-shadow 0.2s;
}

.final-line.flicker {
    animation: finalFlicker 0.1s steps(2) infinite;
}

@keyframes finalFlicker {
    0%   { transform: translate(0, 0); color: #b9e8b9; }
    50%  { transform: translate(-2px, 1px); color: #ff4444;
           text-shadow: 4px 0 #00ffff, -4px 0 #ff00ff, 0 0 30px #ff0000; }
    100% { transform: translate(2px, -1px); color: #b9e8b9; }
}

.final-cursor {
    display: inline-block;
    width: 0.45em;
    height: 1em;
    background: #b9e8b9;
    vertical-align: -0.12em;
    margin-left: 0.18em;
    animation: blink 0.9s steps(1) infinite;
    box-shadow: 0 0 14px rgba(180, 230, 180, 0.9);
}

/* ============ ХОРРОР ============ */

#horror {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    overflow: hidden;
    font-family: "Courier New", monospace;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.9s ease, visibility 0.9s;
}

#horror.active {
    opacity: 1;
    visibility: visible;
}

.static {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg,
        rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 1px,
        transparent 1px, transparent 3px);
    animation: staticMove 0.08s steps(10) infinite;
    opacity: 0.6;
    pointer-events: none;
}

@keyframes staticMove {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-6px, 6px); }
    50%  { transform: translate(6px, -6px); }
    75%  { transform: translate(-6px, -6px); }
    100% { transform: translate(6px, 6px); }
}

.scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to bottom,
        rgba(0,0,0,0.4) 0px, rgba(0,0,0,0.4) 2px,
        transparent 2px, transparent 4px);
    animation: scanMove 0.15s linear infinite;
    pointer-events: none;
}

@keyframes scanMove {
    0%   { transform: translateY(0); }
    100% { transform: translateY(4px); }
}

.horror-text {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(30px, 8vw, 100px);
    font-weight: bold;
    color: #ff0000;
    text-shadow: 4px 0 #00ffff, -4px 0 #ff00ff, 0 0 30px #ff0000;
    animation: horrorShake 0.05s infinite, rgbSplit 0.05s infinite;
    white-space: nowrap;
    z-index: 3;
    text-align: center;
    letter-spacing: 4px;
    transition: font-size 0.3s ease, letter-spacing 0.3s ease;
}

@keyframes horrorShake {
    0%   { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg); }
    20%  { transform: translate(-50%, -50%) translate(-12px, 6px) rotate(-3deg); }
    40%  { transform: translate(-50%, -50%) translate(12px, -6px) rotate(3deg); }
    60%  { transform: translate(-50%, -50%) translate(-6px, -12px) rotate(-2deg); }
    80%  { transform: translate(-50%, -50%) translate(6px, 12px) rotate(2deg); }
    100% { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg); }
}

@keyframes rgbSplit {
    0%   { text-shadow: 6px 0 #00ffff, -6px 0 #ff00ff; }
    25%  { text-shadow: -6px 0 #00ffff, 6px 0 #ff00ff; }
    50%  { text-shadow: 10px 0 #00ffff, -10px 0 #ff00ff; }
    75%  { text-shadow: -10px 0 #00ffff, 10px 0 #ff00ff; }
    100% { text-shadow: 6px 0 #00ffff, -6px 0 #ff00ff; }
}

.glitch-line {
    position: absolute;
    width: 100%;
    height: 3px;
    background: #79c985;
    opacity: .8;
    animation: lines 0.06s infinite;
    z-index: 4;
}

.glitch-line:nth-child(4) { top: 12%; }
.glitch-line:nth-child(5) { top: 38%; }
.glitch-line:nth-child(6) { top: 64%; }
.glitch-line:nth-child(7) { top: 87%; }

@keyframes lines {
    0%   { transform: translateX(-30%); opacity: .2; }
    50%  { transform: translateX(30%); opacity: 1; }
    100% { transform: translateX(-20%); opacity: .3; }
}

body.horror-active {
    animation: bodyShake 0.08s infinite;
}

@keyframes bodyShake {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(-6px, -6px); }
    20% { transform: translate(6px, 6px); }
    30% { transform: translate(-6px, 6px); }
    40% { transform: translate(6px, -6px); }
    50% { transform: translate(-6px, -6px); }
    60% { transform: translate(6px, 6px); }
    70% { transform: translate(-6px, 6px); }
    80% { transform: translate(6px, -6px); }
}

.invert {
    filter: invert(1) hue-rotate(180deg) contrast(2);
}

.corrupted {
    color: #ff0000 !important;
    text-shadow: 2px 0 #00ffff, -2px 0 #ff00ff;
}

/* ============ ПРИЗРАЧНЫЕ АНОМАЛИИ ============ */

.ghost-msg {
    position: fixed;
    font-family: "VT323", "Courier New", monospace;
    font-size: clamp(14px, 1.7vw, 24px);
    color: #5a9a5a;
    letter-spacing: 2px;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: 15;
    text-shadow: 0 0 8px rgba(120, 200, 120, 0.6);
    text-transform: uppercase;
    white-space: nowrap;
}

.ghost-msg.visible { opacity: 0.7; }

.random-char {
    position: fixed;
    font-family: "VT323", "Courier New", monospace;
    color: #5a9a5a;
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
    z-index: 14;
    text-shadow: 0 0 6px rgba(120, 200, 120, 0.7);
}

.random-char.visible { opacity: 0.5; }

body.static-burst::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg,
        rgba(255,255,255,0.13) 0px, rgba(255,255,255,0.13) 1px,
        transparent 1px, transparent 2px);
    z-index: 50;
    pointer-events: none;
    animation: staticMove 0.08s steps(10) infinite;
    mix-blend-mode: screen;
}

@media (prefers-reduced-motion: reduce) {
    .cursor, .glitch-line, .static, .scanlines,
    .horror-text, body.horror-active,
    .final-line.flicker, body.static-burst::after { animation: none !important; }
}
</style>
</head>

<body>

<div id="screen">
    <div id="log"></div>
</div>

<div id="horror">
    <div class="static"></div>
    <div class="scanlines"></div>
    <div class="horror-text" id="horrorText">ADMIN → INSIDE</div>
    <div class="glitch-line"></div>
    <div class="glitch-line"></div>
    <div class="glitch-line"></div>
    <div class="glitch-line"></div>
</div>

<script>
(function () {
    "use strict";

    const log        = document.getElementById("log");
    const screenEl   = document.getElementById("screen");
    const horror     = document.getElementById("horror");
    const horrorText = document.getElementById("horrorText");

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ---------- курсор ---------- */
    const caret = document.createElement("span");
    caret.className = "cursor";
    caret.setAttribute("aria-hidden", "true");

    function makeLine(text, cls) {
        const el = document.createElement("div");
        el.className = "line" + (cls ? " " + cls : "");
        el.textContent = text === "" ? "\u00A0" : text;
        return el;
    }

    function render(lines) {
        log.textContent = "";
        for (let i = 0; i < lines.length; i++) {
            log.appendChild(makeLine(lines[i][0], lines[i][1]));
        }
        log.appendChild(caret);
        log.scrollTop = log.scrollHeight;
    }

    /* ---------- сценарий ---------- */

    const OPENING = [
        ["SYSTEM LOG", "dim"],
        [""],
        ["CONNECTION ESTABLISHED"],
        ["EDITORIAL NETWORK / ARCHIVE"],
        [""],
        ["ADMIN — ACTIVE"],
        [""],
        ["PC-04 → PC-07"],
        ["PC-07 → PC-04"],
        ["PC-04 → PC-04"],
        [""],
        ["PORT STATUS: UNKNOWN"],
        [""],
        ["09:15 ADMIN → PORT"]
    ];

    /* ---------- печать логов ---------- */

    let index = 0;

    function typeLine() {
        if (index >= OPENING.length) {
            setTimeout(startHorror, 1600);
            return;
        }
        const entry = OPENING[index];
        log.insertBefore(makeLine(entry[0], entry[1]), caret);
        log.scrollTop = log.scrollHeight;
        index++;
        const delay = entry[0] ? 190 + Math.random() * 110 : 90;
        setTimeout(typeLine, delay);
    }

    /* ---------- ХОРРОР ---------- */

    function startHorror() {
        if (reduceMotion) {
            startFinale();
            return;
        }

        document.body.classList.add("horror-active");
        horror.classList.add("active");

        const phrases = [
            "YOU ARE INSIDE",
            "ADMIN → INSIDE",
            "ОНО ВНУТРИ",
            "HE SEES YOU",
            "BEHIND YOU",
            "NO ESCAPE",
            "SYSTEM FAILURE",
            "CORRUPTED",
            "ПОРТ ОТКРЫТ",
            "ТЫ ВНУТРИ",
            "НЕ ВЫХОДИ",
            "СЛИШКОМ ПОЗДНО"
        ];

        const textInterval = setInterval(function () {
            horrorText.textContent = phrases[Math.floor(Math.random() * phrases.length)];

            if (Math.random() < 0.4) screenEl.classList.toggle("invert");

            const colors = ["#000", "#1a0000", "#001a00", "#1a1a00", "#0a0a0a"];
            horror.style.background = colors[Math.floor(Math.random() * colors.length)];
        }, 80);

        /* порча логов */
        const symbols = "!@#$%^&*()_+-=[]{}|;:\",.<>?/\\~`ЖДЫШЩЮЯ";
        const corruptionInterval = setInterval(function () {
            const lines = log.querySelectorAll(".line");
            if (!lines.length) return;
            const line = lines[Math.floor(Math.random() * lines.length)];
            const txt = line.textContent;
            if (txt === "\u00A0" || txt.length < 2) return;
            const pos = Math.floor(Math.random() * txt.length);
            const sym = symbols[Math.floor(Math.random() * symbols.length)];
            line.textContent = txt.substring(0, pos) + sym + txt.substring(pos + 1);
            line.classList.add("corrupted");
            if (Math.random() < 0.3) {
                setTimeout(function () { line.classList.remove("corrupted"); }, 150);
            }
        }, 40);

        /* финальный выброс */
        setTimeout(function () {
            clearInterval(textInterval);
            clearInterval(corruptionInterval);

            horrorText.textContent = "YOU ARE INSIDE";
            horrorText.style.color = "#ff0000";
            horrorText.style.textShadow = "0 0 40px #ff0000, 8px 0 #00ffff, -8px 0 #ff00ff";
            horrorText.style.fontSize = "clamp(50px, 14vw, 180px)";
            horrorText.style.letterSpacing = "8px";

            const finalFlash = setInterval(function () {
                horror.style.background = Math.random() < 0.5 ? "#1a0000" : "#000";
                screenEl.classList.toggle("invert");
            }, 60);

            setTimeout(function () {
                clearInterval(finalFlash);
                startFinale();
            }, 2400);
        }, 4200);
    }

    /* ---------- ФИНАЛ: тишина и медленная печать ---------- */

    function startFinale() {
        // плавно убираем хоррор
        horror.classList.remove("active");
        document.body.classList.remove("horror-active");
        screenEl.classList.remove("invert");
        horror.style.background = "#000";

        // дать экрану "остыть"
        setTimeout(function () {
            log.classList.add("finale-mode");
            log.textContent = "";

            const finalLine = document.createElement("div");
            finalLine.className = "final-line";

            const textSpan = document.createElement("span");
            textSpan.className = "final-text";

            const cursor = document.createElement("span");
            cursor.className = "final-cursor";

            finalLine.appendChild(textSpan);
            finalLine.appendChild(cursor);
            log.appendChild(finalLine);

            const msg = "YOU ARE ALREADY HERE TOO";

            if (reduceMotion) {
                textSpan.textContent = msg;
                startMystery(finalLine);
                return;
            }

            typeFinalMessage(textSpan, finalLine, msg);
        }, 1900);
    }

    function typeFinalMessage(target, lineEl, text) {
        let i = 0;

        function step() {
            if (i >= text.length) {
                setTimeout(function () { startMystery(lineEl); }, 1400);
                return;
            }

            const ch = text[i];
            target.textContent += ch;
            i++;

            // редкое искажение прямо во время печати
            if (Math.random() < 0.09) {
                lineEl.classList.add("flicker");
                setTimeout(function () { lineEl.classList.remove("flicker"); },
                    90 + Math.random() * 130);
            }

            let delay;
            if (ch === " ") {
                delay = 600 + Math.random() * 500;   // долгие паузы между словами
            } else {
                delay = 130 + Math.random() * 180;
                if (Math.random() < 0.12) delay += 380; // редкие "зависания"
            }
            setTimeout(step, delay);
        }

        step();
    }

    /* ---------- АНОМАЛИИ ПОСЛЕ ПОСЛАНИЯ ---------- */

    function startMystery(finalLine) {
        const ghosts = [
            "PC-04",
            "09:16",
            "09:17",
            "он всё ещё здесь",
            "порт №7",
            "не оглядывайся",
            "PC-07 → YOU",
            "THE PORT IS OPEN",
            "он смотрит",
            "он рядом",
            "the wall has eyes",
            "you cannot leave",
            "он дышит",
            "ты следующий",
            "он уже внутри",
            "не выходи"
        ];

        // 1. Призрачные сообщения всплывают в случайных точках
        (function ghostLoop() {
            const msg = document.createElement("div");
            msg.className = "ghost-msg";
            msg.textContent = ghosts[Math.floor(Math.random() * ghosts.length)];
            msg.style.left = (8 + Math.random() * 68) + "%";
            msg.style.top  = (8 + Math.random() * 80) + "%";
            document.body.appendChild(msg);

            requestAnimationFrame(function () { msg.classList.add("visible"); });
            setTimeout(function () { msg.classList.remove("visible"); },
                500 + Math.random() * 900);
            setTimeout(function () { msg.remove(); }, 2300);

            setTimeout(ghostLoop, 2500 + Math.random() * 4500);
        })();

        // 2. Одиночные символы-призраки
        const chars = "ЖДЫШЩЮЯABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@$%&";
        setInterval(function () {
            const c = document.createElement("div");
            c.className = "random-char";
            c.textContent = chars[Math.floor(Math.random() * chars.length)];
            c.style.left = (Math.random() * 92) + "%";
            c.style.top  = (Math.random() * 88) + "%";
            c.style.fontSize = (12 + Math.random() * 26) + "px";
            document.body.appendChild(c);
            requestAnimationFrame(function () { c.classList.add("visible"); });
            setTimeout(function () { c.classList.remove("visible"); },
                250 + Math.random() * 550);
            setTimeout(function () { c.remove(); }, 1400);
        }, 1600);

        // 3. Редкая порча самого послания
        setInterval(function () {
            if (!finalLine) return;
            if (Math.random() < 0.5) {
                finalLine.classList.add("flicker");
                setTimeout(function () { finalLine.classList.remove("flicker"); },
                    80 + Math.random() * 180);
            }
        }, 2200);

        // 4. Вспышки статики
        setInterval(function () {
            if (Math.random() < 0.4) {
                document.body.classList.add("static-burst");
                setTimeout(function () { document.body.classList.remove("static-burst"); },
                    50 + Math.random() * 90);
            }
        }, 3500);

        // 5. Медленная пульсация яркости свечения
        let pulse = 0;
        setInterval(function () {
            if (!finalLine) return;
            pulse = (pulse + 1) % 8;
            const glow = 15 + Math.abs(4 - pulse) * 6;
            finalLine.style.textShadow =
                "1.5px 0 0 #b9e8b9, -1.5px 0 0 #b9e8b9, " +
                "0 1.5px 0 #b9e8b9, 0 -1.5px 0 #b9e8b9, " +
                "1.5px 1.5px 0 #b9e8b9, -1.5px -1.5px 0 #b9e8b9, " +
                "1.5px -1.5px 0 #b9e8b9, -1.5px 1.5px 0 #b9e8b9, " +
                "0 0 " + glow + "px rgba(120, 200, 120, 0.55), " +
                "0 0 " + (glow * 2.5) + "px rgba(80, 160, 80, 0.35)";
        }, 900);
    }

    /* ---------- запуск ---------- */

    render([]);
    setTimeout(typeLine, 400);

})();
</script>

</body>
</html>
