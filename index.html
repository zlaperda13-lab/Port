<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORT</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #020302;
    color: #78a878;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#screen {
    width: 90%;
    max-width: 900px;
    height: 82%;
    padding: 28px;
    box-sizing: border-box;
    background: #061006;
    border: 1px solid #29402d;
    box-shadow:
        inset 0 0 70px #000,
        0 0 25px #0b170d;
    position: relative;
}

#log {
    font-size: clamp(14px, 2vw, 19px);
    line-height: 1.65;
    white-space: pre-wrap;
}

.dim {
    opacity: .45;
}

.cursor {
    display: inline-block;
    width: 10px;
    height: 18px;
    background: #78a878;
    animation: blink .7s steps(1) infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* ГЛИТЧ */

#glitch {
    position: fixed;
    inset: 0;
    display: none;
    background: #000;
    color: #79c985;
    font-family: "Courier New", monospace;
    z-index: 20;
    overflow: hidden;
}

.glitch-text {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(18px, 5vw, 55px);
    font-weight: bold;
    white-space: nowrap;
    text-shadow:
        4px 0 #ff003c,
        -4px 0 #00ffff;
    animation: shake .05s infinite;
}

.glitch-line {
    position: absolute;
    width: 100%;
    height: 3px;
    background: #79c985;
    opacity: .7;
    animation: lines .08s infinite;
}

.glitch-line:nth-child(2) { top: 18%; }
.glitch-line:nth-child(3) { top: 43%; }
.glitch-line:nth-child(4) { top: 71%; }
.glitch-line:nth-child(5) { top: 88%; }

@keyframes shake {
    0%   { transform: translate(-50%, -50%) translate(0); }
    25%  { transform: translate(-48%, -52%) translate(8px, -3px); }
    50%  { transform: translate(-52%, -48%) translate(-7px, 4px); }
    75%  { transform: translate(-49%, -51%) translate(4px, 6px); }
    100% { transform: translate(-50%, -50%) translate(0); }
}

@keyframes lines {
    0% { transform: translateX(-20%); }
    50% { transform: translateX(20%); }
    100% { transform: translateX(-10%); }
}

.red {
    color: #b63b3b;
}

.big {
    font-size: clamp(25px, 7vw, 70px);
}

/* СТАРЫЙ МОНИТОР */

.crt {
    animation: crt .12s infinite;
}

@keyframes crt {
    0% { filter: brightness(1); }
    50% { filter: brightness(.7) contrast(1.4); }
    100% { filter: brightness(1.2); }
}
</style>
</head>

<body>

<div id="screen">
    <div id="log"></div>
</div>

<div id="glitch">
    <div class="glitch-text" id="glitchText">
        ADMIN → INSIDE
    </div>

    <div class="glitch-line"></div>
    <div class="glitch-line"></div>
    <div class="glitch-line"></div>
    <div class="glitch-line"></div>
</div>

<script>

const lines = [
    "SYSTEM LOG",
    "",
    "CONNECTION ESTABLISHED",
    "EDITORIAL NETWORK / ARCHIVE",
    "",
    "ADMIN — ACTIVE",
    "",
    "PC-04 → PC-07",
    "PC-07 → PC-04",
    "PC-04 → PC-04",
    "",
    "PORT STATUS: UNKNOWN",
    "",
    "09:15 ADMIN → PORT"
];

const log = document.getElementById("log");
const glitch = document.getElementById("glitch");
const glitchText = document.getElementById("glitchText");

let index = 0;

function typeLine() {

    if (index >= lines.length) {

        setTimeout(startGlitch, 1800);
        return;
    }

    const line = document.createElement("div");

    if (index === 0 || index === 10) {
        line.className = "dim";
    }

    line.textContent = lines[index];

    log.appendChild(line);

    index++;

    setTimeout(typeLine, 220);
}

function startGlitch() {

    glitch.style.display = "block";

    let phase = 0;

    const interval = setInterval(() => {

        phase++;

        if (phase === 1) {
            glitchText.textContent = "09:15 ADMIN → INSIDE";
        }

        if (phase === 5) {
            glitchText.textContent = "ADMIN — ACTIVE";
        }

        if (phase === 9) {
            glitchText.textContent = "ADMIN → WALL";
        }

        if (phase === 13) {
            glitchText.textContent = "PC-04 → PC-04";
        }

        if (phase === 17) {
            glitchText.textContent = "YOU ARE INSIDE";
            glitchText.classList.add("big", "red");
        }

        if (phase >= 25) {

            clearInterval(interval);

            setTimeout(() => {

                glitch.style.display = "none";

                document.body.classList.add("crt");

                log.innerHTML =
                    "SYSTEM LOG\n\n" +
                    "ADMIN — ACTIVE\n\n" +
                    "09:15 ADMIN → PORT\n\n" +
                    "09:15 ADMIN → INSIDE\n\n" +
                    "09:16 ADMIN → WALL\n\n" +
                    "<span class='cursor'></span>";

            }, 350);

        }

    }, 90);
}

typeLine();

</script>

</body>
</html>
